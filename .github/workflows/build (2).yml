name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          cat > settings.gradle <<'KAI_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "KaiIcons"
          include ":app"
          KAI_EOF
          cat > build.gradle <<'KAI_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          KAI_EOF
          cat > gradle.properties <<'KAI_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          KAI_EOF
          mkdir -p app
          cat > app/build.gradle <<'KAI_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.kai.icons'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.kai.recolor'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
          }
          KAI_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KAI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application android:label="MTZ Recolor" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KAI_EOF
          mkdir -p app/src/main/java/com/kai/icons
          cat > app/src/main/java/com/kai/icons/MainActivity.kt <<'KAI_EOF'
          package com.kai.icons

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.util.Log
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.core.graphics.ColorUtils
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.util.zip.CRC32
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream
          import kotlin.math.*

          class MainActivity : Activity() {
              class V(val name: String, val bg: Int, val fg: Int)

              lateinit var rootLL: LinearLayout
              lateinit var wall: ImageView
              lateinit var packInfo: TextView
              lateinit var sw: LinearLayout
              lateinit var before: LinearLayout
              lateinit var after: LinearLayout
              lateinit var info: TextView
              lateinit var status: TextView
              lateinit var openBtn: Button
              var density = 1f
              var baseH = 25f
              var baseS = .45f
              var accentH = 205f
              var sel = 0
              var customBg: Int? = null
              var customFg: Int? = null
              val outerFiles = LinkedHashMap<String, ByteArray>()
              val innerFiles = LinkedHashMap<String, ByteArray>()
              var srcName = "theme.mtz"
              var srcTile = 0
              var srcLogo = 0
              var prevBitmaps: List<Bitmap> = emptyList()
              var lastUri: Uri? = null

              fun px(n: Int) = (n * density).toInt()
              fun hsl(h: Float, s: Float, l: Float) =
                  ColorUtils.HSLToColor(floatArrayOf(((h % 360) + 360) % 360, s.coerceIn(0f, 1f), l))

              fun lum(p: Int) = (0.299 * Color.red(p) + 0.587 * Color.green(p) + 0.114 * Color.blue(p)) / 255.0

              fun dist(a: Int, b: Int): Double {
                  val dr = (Color.red(a) - Color.red(b)).toDouble()
                  val dg = (Color.green(a) - Color.green(b)).toDouble()
                  val db = (Color.blue(a) - Color.blue(b)).toDouble()
                  return sqrt(dr * dr + dg * dg + db * db)
              }

              fun hex(c: Int) = "#%06X".format(c and 0xFFFFFF)

              // ---------- палитры ----------
              fun variants(): List<V> {
                  val h = baseH
                  val s = min(baseS, .6f)
                  val list = arrayListOf(
                      V("Тёмный", hsl(h, s * .6f, .17f), hsl(h, max(.25f, s), .82f)),
                      V("Светлый", hsl(h, s * .6f, .94f), hsl(h, max(.3f, s), .36f)),
                      V("Яркий", hsl(h, max(.5f, baseS), .46f), hsl(h, .6f, .93f)),
                      V("Тональный", hsl(h, s * .5f, .30f), hsl(h, s * .6f, .78f)),
                      V("Акцент", hsl(accentH, s * .5f, .20f), hsl(h, max(.45f, s), .72f))
                  )
                  val cb = customBg
                  val cf = customFg
                  if (cb != null && cf != null) list.add(V("Своё", cb, cf))
                  return list
              }

              fun hueDist(a: Float, b: Float) = abs((((a - b) % 360) + 540) % 360 - 180)

              fun setBaseFromColor(col: Int, accentCol: Int? = null) {
                  val hh = FloatArray(3)
                  ColorUtils.colorToHSL(col, hh)
                  baseH = hh[0]
                  baseS = hh[1].coerceIn(.15f, .9f)
                  accentH = (baseH + 180) % 360
                  if (accentCol != null) {
                      val h2 = FloatArray(3)
                      ColorUtils.colorToHSL(accentCol, h2)
                      if (h2[1] > .15f && hueDist(h2[0], baseH) > 30f) accentH = h2[0]
                  }
                  sel = 0
                  refresh()
              }

              // Подбор цвета под картинку: кластеры цветов, побеждает самый заметный (много пикселей и насыщенный)
              fun extract(bm: Bitmap) {
                  val sm = Bitmap.createScaledBitmap(bm, 40, 40, true)
                  val n = 1600
                  val px = IntArray(n)
                  sm.getPixels(px, 0, 40, 0, 0, 40, 40)
                  val k = 6
                  val cr = DoubleArray(k)
                  val cg = DoubleArray(k)
                  val cb = DoubleArray(k)
                  for (j in 0 until k) {
                      val c = px[(j * n / k + n / (2 * k)) % n]
                      cr[j] = Color.red(c).toDouble()
                      cg[j] = Color.green(c).toDouble()
                      cb[j] = Color.blue(c).toDouble()
                  }
                  val asg = IntArray(n)
                  repeat(8) {
                      val sr = DoubleArray(k)
                      val sg = DoubleArray(k)
                      val sb = DoubleArray(k)
                      val cnt = IntArray(k)
                      for (i in 0 until n) {
                          val r = Color.red(px[i]).toDouble()
                          val g = Color.green(px[i]).toDouble()
                          val b = Color.blue(px[i]).toDouble()
                          var bj = 0
                          var bd = Double.MAX_VALUE
                          for (j in 0 until k) {
                              val d = (r - cr[j]) * (r - cr[j]) + (g - cg[j]) * (g - cg[j]) + (b - cb[j]) * (b - cb[j])
                              if (d < bd) {
                                  bd = d
                                  bj = j
                              }
                          }
                          asg[i] = bj
                          sr[bj] += r; sg[bj] += g; sb[bj] += b
                          cnt[bj]++
                      }
                      for (j in 0 until k) if (cnt[j] > 0) {
                          cr[j] = sr[j] / cnt[j]
                          cg[j] = sg[j] / cnt[j]
                          cb[j] = sb[j] / cnt[j]
                      }
                  }
                  val cnt = IntArray(k)
                  for (a in asg) cnt[a]++
                  val hh = FloatArray(3)
                  val found = ArrayList<Triple<Double, Float, Float>>()
                  for (j in 0 until k) {
                      if (cnt[j] == 0) continue
                      ColorUtils.colorToHSL(Color.rgb(cr[j].toInt(), cg[j].toInt(), cb[j].toInt()), hh)
                      val score = cnt[j] * hh[1].toDouble().pow(1.5) * (1 - abs(2 * hh[2] - 1))
                      found.add(Triple(score, hh[0], hh[1]))
                  }
                  found.sortByDescending { it.first }
                  if (found.isEmpty() || found[0].first < 1.0) {
                      baseS = .06f
                  } else {
                      baseH = found[0].second
                      baseS = found[0].third.coerceIn(.15f, .9f)
                      accentH = (baseH + 180) % 360
                      for (f in found) {
                          if (f.first > 1.0 && hueDist(f.second, baseH) > 40f) {
                              accentH = f.second
                              break
                          }
                      }
                  }
                  sel = 0
                  refresh()
              }

              fun fromPhone() {
                  try {
                      val wc = WallpaperManager.getInstance(this).getWallpaperColors(WallpaperManager.FLAG_SYSTEM)
                      if (wc == null) {
                          status.text = "Не удалось прочитать обои. Выберите картинку из галереи."
                          return
                      }
                      val second = wc.secondaryColor
                      setBaseFromColor(wc.primaryColor.toArgb(), second?.toArgb())
                      status.text = "Цвета взяты из обоев телефона."
                  } catch (e: Exception) {
                      status.text = "Не удалось прочитать обои: ${e.message}"
                  }
              }

              // ---------- свой цвет ----------
              fun parseHex(s: String): Int? {
                  var t = s.trim().removePrefix("#")
                  if (t.length == 3) t = t.map { "$it$it" }.joinToString("")
                  if (t.length != 6) return null
                  return try {
                      Color.parseColor("#" + t)
                  } catch (e: Exception) {
                      null
                  }
              }

              fun autoLogo(bg: Int): Int {
                  val hh = FloatArray(3)
                  ColorUtils.colorToHSL(bg, hh)
                  val darkBg = lum(bg) < .5
                  val c = ColorUtils.HSLToColor(floatArrayOf(hh[0], min(hh[1] + .1f, .8f), if (darkBg) .85f else .2f))
                  if (ColorUtils.calculateContrast(c, bg) >= 4.5) return c
                  return if (darkBg) 0xFFFFFFFF.toInt() else 0xFF000000.toInt()
              }

              fun customDialog() {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(px(20), px(8), px(20), 0)
                  val e1 = EditText(this)
                  e1.hint = "Цвет плитки, например 432606"
                  e1.setSingleLine()
                  val e2 = EditText(this)
                  e2.hint = "Цвет логотипа (можно оставить пустым)"
                  e2.setSingleLine()
                  box.addView(e1)
                  box.addView(e2)
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Свой цвет (HEX)")
                      .setView(box)
                      .setPositiveButton("Применить") { _, _ ->
                          val a = parseHex(e1.text.toString())
                          if (a == null) {
                              status.text = "Неверный цвет плитки. Нужно 6 символов 0-9 и A-F, например 432606."
                          } else {
                              val bg = a or 0xFF000000.toInt()
                              val fg = (parseHex(e2.text.toString()) ?: autoLogo(bg)) or 0xFF000000.toInt()
                              customBg = bg
                              customFg = fg
                              val h3 = FloatArray(3)
                              ColorUtils.colorToHSL(bg, h3)
                              baseH = h3[0]
                              baseS = h3[1].coerceIn(.15f, .9f)
                              sel = 5
                              refresh()
                              status.text = "Свой цвет применён."
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              // ---------- чтение темы .mtz ----------
              fun baseName(path: String) = path.substringAfterLast('/')

              // Какие файлы перекрашиваем: png в папках drawable, кроме масок и иконок папок
              fun isIcon(path: String): Boolean {
                  if (!path.endsWith(".png") || !path.contains("drawable")) return false
                  val b = baseName(path)
                  return !(b.startsWith("icon_mask") || b.startsWith("folder_") || b.startsWith("icon_folder"))
              }

              fun displayName(uri: Uri): String {
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0 && c.moveToFirst()) return c.getString(i)
                      }
                  } catch (e: Exception) {
                  }
                  return "theme.mtz"
              }

              fun cfgColor(cfg: String, key: String): Int? {
                  val m = Regex(key + "\" value=\"(#[0-9A-Fa-f]{6})\"").find(cfg) ?: return null
                  return Color.parseColor(m.groupValues[1])
              }

              // Определяем два главных цвета темы: плитка и логотип
              fun detect(inner: Map<String, ByteArray>, names: List<String>): Pair<Int, Int>? {
                  var tile = 0
                  val pat = inner.entries.firstOrNull { baseName(it.key) == "icon_pattern.png" }
                  if (pat != null) {
                      val bm = BitmapFactory.decodeByteArray(pat.value, 0, pat.value.size)
                      if (bm != null) {
                          val c = bm.getPixel(bm.width / 2, bm.height / 2)
                          if (Color.alpha(c) > 200) tile = c or 0xFF000000.toInt()
                      }
                  }
                  val cnt = HashMap<Int, Int>()
                  var total = 0
                  for (nm in names.take(60)) {
                      val data = inner[nm] ?: continue
                      val bm = BitmapFactory.decodeByteArray(data, 0, data.size) ?: continue
                      val w = bm.width
                      val h = bm.height
                      val p = IntArray(w * h)
                      bm.getPixels(p, 0, w, 0, 0, w, h)
                      var i = 0
                      while (i < p.size) {
                          val c = p[i]
                          if (Color.alpha(c) > 250) {
                              val k = ((Color.red(c) shr 3) shl 10) or ((Color.green(c) shr 3) shl 5) or (Color.blue(c) shr 3)
                              cnt[k] = (cnt[k] ?: 0) + 1
                              total++
                          }
                          i += 3
                      }
                  }
                  if (total == 0) return null
                  fun bucket(k: Int) = Color.rgb(((k shr 10) and 31) * 8 + 4, ((k shr 5) and 31) * 8 + 4, (k and 31) * 8 + 4)
                  if (tile == 0) tile = bucket(cnt.maxByOrNull { it.value }!!.key)
                  var logo = 0
                  val cfgBytes = inner.entries.firstOrNull { baseName(it.key) == "transform_config.xml" }?.value
                  val cfg = if (cfgBytes != null) String(cfgBytes) else ""
                  val black = cfgColor(cfg, "BlackColor")
                  val white = cfgColor(cfg, "WhiteColor")
                  if (black != null && white != null) {
                      logo = if (abs(lum(white) - lum(tile)) > abs(lum(black) - lum(tile))) white else black
                  }
                  if (logo == 0 || dist(logo, tile) < 60) {
                      var bestD = -1.0
                      var best = tile
                      val minCount = max(3, (total * 0.003).toInt())
                      for ((k, n) in cnt) {
                          if (n < minCount) continue
                          val c = bucket(k)
                          val d = dist(c, tile)
                          if (d > bestD) {
                              bestD = d
                              best = c
                          }
                      }
                      logo = best
                  }
                  return Pair(tile or 0xFF000000.toInt(), logo or 0xFF000000.toInt())
              }

              fun readZip(bytes: ByteArray): LinkedHashMap<String, ByteArray> {
                  val m = LinkedHashMap<String, ByteArray>()
                  ZipInputStream(ByteArrayInputStream(bytes)).use { z ->
                      var e = z.nextEntry
                      while (e != null) {
                          if (!e.isDirectory) m[e.name] = z.readBytes()
                          e = z.nextEntry
                      }
                  }
                  return m
              }

              fun importPack(uri: Uri) {
                  try {
                      val bytes = contentResolver.openInputStream(uri)!!.use { it.readBytes() }
                      val outer = readZip(bytes)
                      val ib = outer["icons"] ?: throw Exception("в теме нет архива icons (иконок)")
                      val inner = readZip(ib)
                      val names = inner.keys.filter { isIcon(it) }
                      if (names.isEmpty()) throw Exception("в теме нет png-иконок")
                      val cols = detect(inner, names) ?: throw Exception("не удалось определить цвета темы")
                      if (dist(cols.first, cols.second) < 30) throw Exception("плитка и логотип почти одного цвета")
                      val pref = listOf("com.android.camera", "com.android.contacts.activities.TwelveKeyDialer",
                          "com.android.settings", "com.miui.gallery", "com.whatsapp", "org.telegram.messenger",
                          "com.android.chrome", "com.android.vending")
                      val pn = ArrayList<String>()
                      for (p in pref) {
                          val f = names.firstOrNull { baseName(it) == p + ".png" }
                          if (f != null) pn.add(f)
                      }
                      for (f in names) {
                          if (pn.size >= 8) break
                          if (!pn.contains(f)) pn.add(f)
                      }
                      val bms = ArrayList<Bitmap>()
                      for (f in pn.take(8)) {
                          val d = inner[f] ?: continue
                          val bm = BitmapFactory.decodeByteArray(d, 0, d.size)
                          if (bm != null) bms.add(bm)
                      }
                      outerFiles.clear()
                      outerFiles.putAll(outer)
                      innerFiles.clear()
                      innerFiles.putAll(inner)
                      srcName = displayName(uri)
                      srcTile = cols.first
                      srcLogo = cols.second
                      prevBitmaps = bms
                      packInfo.text = srcName + "\nИконок: " + names.size + " · плитка " + hex(srcTile) + " · логотип " + hex(srcLogo)
                      refresh()
                  } catch (e: Throwable) {
                      packInfo.text = "Не удалось прочитать тему: " + e.message
                  }
              }

              // ---------- перекраска ----------
              // Каждый пиксель проецируется на линию «цвет плитки -> цвет логотипа» и переносится на такую же линию новой палитры
              fun recolor(src: Bitmap, t0: Int, l0: Int, t1: Int, l1: Int): Bitmap {
                  val w = src.width
                  val h = src.height
                  val p = IntArray(w * h)
                  src.getPixels(p, 0, w, 0, 0, w, h)
                  val dr = (Color.red(l0) - Color.red(t0)).toDouble()
                  val dg = (Color.green(l0) - Color.green(t0)).toDouble()
                  val db = (Color.blue(l0) - Color.blue(t0)).toDouble()
                  val den = dr * dr + dg * dg + db * db
                  if (den < 1) return src
                  for (i in p.indices) {
                      val a = Color.alpha(p[i])
                      if (a == 0) continue
                      val t = (((Color.red(p[i]) - Color.red(t0)) * dr + (Color.green(p[i]) - Color.green(t0)) * dg +
                          (Color.blue(p[i]) - Color.blue(t0)) * db) / den).coerceIn(0.0, 1.0)
                      p[i] = (ColorUtils.blendARGB(t1, l1, t.toFloat()) and 0xFFFFFF) or (a shl 24)
                  }
                  return Bitmap.createBitmap(p, w, h, Bitmap.Config.ARGB_8888)
              }

              fun png(b: Bitmap): ByteArray {
                  val o = ByteArrayOutputStream()
                  b.compress(Bitmap.CompressFormat.PNG, 100, o)
                  return o.toByteArray()
              }

              fun stored(z: ZipOutputStream, name: String, data: ByteArray) {
                  val e = ZipEntry(name)
                  e.method = ZipEntry.STORED
                  e.size = data.size.toLong()
                  e.compressedSize = data.size.toLong()
                  val crc = CRC32()
                  crc.update(data)
                  e.crc = crc.value
                  z.putNextEntry(e)
                  z.write(data)
                  z.closeEntry()
              }

              fun newConfig(cfg: String, v: V): String {
                  val lo = if (lum(v.bg) < lum(v.fg)) v.bg else v.fg
                  val hi = if (lum(v.bg) < lum(v.fg)) v.fg else v.bg
                  var r = cfg
                  r = Regex("(BlackColor\" value=\")#[0-9A-Fa-f]{6}").replace(r) { it.groupValues[1] + hex(lo) }
                  r = Regex("(WhiteColor\" value=\")#[0-9A-Fa-f]{6}").replace(r) { it.groupValues[1] + hex(hi) }
                  return r
              }

              fun retitle(xml: String): String =
                  Regex("(<title[^>]*>\\s*<!\\[CDATA\\[)(.*?)(\\]\\]>\\s*</title>)", RegexOption.DOT_MATCHES_ALL)
                      .replace(xml) { it.groupValues[1] + it.groupValues[2] + " Kai" + it.groupValues[3] }

              fun saveMtz(bytes: ByteArray, fileName: String): Uri? {
                  val cv = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                      put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream")
                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return null
                  contentResolver.openOutputStream(uri)!!.use { it.write(bytes) }
                  return uri
              }

              fun openInThemes(uri: Uri) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/octet-stream")
                          .setPackage("com.android.thememanager").addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                  } catch (e: Exception) {
                      status.text = status.text.toString() + " Откройте файл через «Темы» вручную."
                  }
              }

              fun create(btn: Button) {
                  if (innerFiles.isEmpty()) {
                      status.text = "Сначала выберите тему .mtz."
                      return
                  }
                  btn.isEnabled = false
                  val v = variants()[sel]
                  val t0 = srcTile
                  val l0 = srcLogo
                  Thread {
                      try {
                          val inner = ByteArrayOutputStream()
                          var n = 0
                          ZipOutputStream(inner).use { z ->
                              val total = innerFiles.size
                              var i = 0
                              for ((name, data) in innerFiles) {
                                  i++
                                  var out = data
                                  if (isIcon(name)) {
                                      val bm = BitmapFactory.decodeByteArray(data, 0, data.size)
                                      if (bm != null) {
                                          out = png(recolor(bm, t0, l0, v.bg, v.fg))
                                          n++
                                      }
                                  } else if (baseName(name) == "transform_config.xml") {
                                      out = newConfig(String(data), v).toByteArray()
                                  }
                                  stored(z, name, out)
                                  val cur = i
                                  runOnUiThread { status.text = "Перекрашиваю: $cur/$total" }
                              }
                          }
                          val outer = ByteArrayOutputStream()
                          ZipOutputStream(outer).use { z ->
                              for ((name, data) in outerFiles) {
                                  val out = when (name) {
                                      "icons" -> inner.toByteArray()
                                      "description.xml" -> retitle(String(data)).toByteArray()
                                      else -> data
                                  }
                                  stored(z, name, out)
                              }
                          }
                          val outName = srcName.removeSuffix(".mtz") + "_Kai.mtz"
                          val uri = saveMtz(outer.toByteArray(), outName)
                          runOnUiThread {
                              btn.isEnabled = true
                              lastUri = uri
                              status.text = "Готово: перекрашено иконок $n. Файл $outName лежит в Загрузках."
                              if (uri != null) {
                                  openBtn.visibility = View.VISIBLE
                                  openInThemes(uri)
                              }
                          }
                      } catch (e: Throwable) {
                          runOnUiThread {
                              btn.isEnabled = true
                              status.text = "Ошибка: " + e.message
                          }
                      }
                  }.start()
              }

              // ---------- интерфейс ----------
              fun tv(t: String, size: Float, color: Int, bold: Boolean) = TextView(this).apply {
                  text = t; textSize = size; setTextColor(color)
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              fun card(title: String): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(px(14), px(14), px(14), px(14))
                      background = GradientDrawable().apply { setColor(0xFF262020.toInt()); cornerRadius = px(20).toFloat() }
                  }
                  c.addView(tv(title, 15f, 0xFFF1E6E2.toInt(), true))
                  val lp = LinearLayout.LayoutParams(-1, -2)
                  lp.topMargin = px(12)
                  rootLL.addView(c, lp)
                  return c
              }

              fun btn(t: String, bg: Int, fg: Int, f: (Button) -> Unit) = Button(this).apply {
                  text = t; isAllCaps = false; setTextColor(fg)
                  background = GradientDrawable().apply { setColor(bg); cornerRadius = px(14).toFloat() }
                  setOnClickListener { f(this) }
              }

              fun iconView(bm: Bitmap, size: Int): ImageView = ImageView(this).apply {
                  setImageBitmap(bm)
                  layoutParams = LinearLayout.LayoutParams(px(size), px(size)).apply { setMargins(px(4), px(4), px(4), px(4)) }
              }

              fun swatch(v: V): Bitmap {
                  val s = 120
                  val bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bm)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = v.bg
                  c.drawRoundRect(0f, 0f, s.toFloat(), s.toFloat(), s * .27f, s * .27f, p)
                  p.color = v.fg
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = s * .09f
                  c.drawCircle(s / 2f, s / 2f, s * .22f, p)
                  return bm
              }

              fun refresh() {
                  val vs = variants()
                  if (sel >= vs.size) sel = 0
                  val v = vs[sel]
                  sw.removeAllViews()
                  vs.forEachIndexed { i, x ->
                      val col = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(px(6), px(6), px(6), px(6))
                          background = GradientDrawable().apply {
                              cornerRadius = px(16).toFloat()
                              if (i == sel) setStroke(px(2), 0xFFF4A58F.toInt())
                          }
                          setOnClickListener { sel = i; refresh() }
                      }
                      col.addView(iconView(swatch(x), 52))
                      col.addView(tv(x.name, 11f, 0xFFA89A96.toInt(), false))
                      sw.addView(col)
                  }
                  info.text = "плитка " + hex(v.bg) + " · логотип " + hex(v.fg) + " · контраст %.1f:1".format(
                      ColorUtils.calculateContrast(v.fg, v.bg))
                  before.removeAllViews()
                  after.removeAllViews()
                  for (bm in prevBitmaps) {
                      before.addView(iconView(bm, 48))
                      after.addView(iconView(recolor(bm, srcTile, srcLogo, v.bg, v.fg), 48))
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val uri = data?.data ?: return
                  if (res != RESULT_OK) return
                  if (req == 1) {
                      try {
                          val o = BitmapFactory.Options().apply { inSampleSize = 4 }
                          val bm = contentResolver.openInputStream(uri).use { BitmapFactory.decodeStream(it, null, o) }!!
                          wall.setImageBitmap(bm)
                          extract(bm)
                      } catch (e: Exception) {
                          status.text = "Не удалось открыть картинку: ${e.message}"
                      }
                  } else if (req == 2) {
                      importPack(uri)
                  }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val prefs = getSharedPreferences("kai", MODE_PRIVATE)
                  val oldH = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try {
                          prefs.edit().putString("crash", Log.getStackTraceString(e).take(1800)).commit()
                      } catch (x: Throwable) {
                      }
                      oldH?.uncaughtException(t, e)
                  }
                  density = resources.displayMetrics.density

                  rootLL = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(px(14), px(34), px(14), px(34))
                  }
                  setContentView(ScrollView(this).apply { setBackgroundColor(0xFF1A1514.toInt()); addView(rootLL) })

                  rootLL.addView(tv("✦ MTZ Recolor", 22f, 0xFFF1E6E2.toInt(), true))
                  rootLL.addView(tv("перекрашивает иконки готовой темы .mtz в цвета твоих обоев", 13f, 0xFFA89A96.toInt(), false))

                  val c0 = card("1. Тема (.mtz)")
                  packInfo = tv("Выберите готовую тему, иконки которой нужно перекрасить.", 12f, 0xFFA89A96.toInt(), false)
                  c0.addView(packInfo)
                  c0.addView(btn("Выбрать .mtz", 0xFF322A29.toInt(), 0xFFF1E6E2.toInt()) {
                      @Suppress("DEPRECATION")
                      startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType("*/*"), 2)
                  }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = px(8) })

                  val c1 = card("2. Цвета")
                  wall = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(0xFF000000.toInt())
                  }
                  c1.addView(wall, LinearLayout.LayoutParams(-1, px(120)).apply { topMargin = px(8) })
                  val row = LinearLayout(this)
                  row.addView(btn("Обои телефона", 0xFF322A29.toInt(), 0xFFF1E6E2.toInt()) { fromPhone() },
                      LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(btn("Галерея", 0xFF322A29.toInt(), 0xFFF1E6E2.toInt()) {
                      @Suppress("DEPRECATION")
                      startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).setType("image/*"), 1)
                  }, LinearLayout.LayoutParams(0, -2, 1f))
                  c1.addView(row)
                  sw = LinearLayout(this)
                  c1.addView(HorizontalScrollView(this).apply { addView(sw) })
                  info = tv("", 12f, 0xFFA89A96.toInt(), false)
                  c1.addView(info)
                  c1.addView(btn("✎ Свой цвет (HEX)", 0xFF322A29.toInt(), 0xFFF1E6E2.toInt()) { customDialog() },
                      LinearLayout.LayoutParams(-1, -2).apply { topMargin = px(8) })

                  val c2 = card("3. Было и стало")
                  before = LinearLayout(this)
                  after = LinearLayout(this)
                  c2.addView(HorizontalScrollView(this).apply { addView(before) })
                  c2.addView(HorizontalScrollView(this).apply { addView(after) })

                  status = tv("", 13f, 0xFFA89A96.toInt(), false)
                  openBtn = btn("Открыть в «Темы»", 0xFF322A29.toInt(), 0xFFF1E6E2.toInt()) { b ->
                      val u = lastUri
                      if (u != null) openInThemes(u)
                  }
                  openBtn.visibility = View.GONE
                  rootLL.addView(btn("✦ Перекрасить и сохранить", 0xFFF4A58F.toInt(), 0xFF2A1410.toInt()) { create(it) },
                      LinearLayout.LayoutParams(-1, px(56)).apply { topMargin = px(14) })
                  rootLL.addView(openBtn, LinearLayout.LayoutParams(-1, -2).apply { topMargin = px(8) })
                  rootLL.addView(status, LinearLayout.LayoutParams(-1, -2).apply { topMargin = px(8) })

                  try {
                      refresh()
                  } catch (e: Throwable) {
                      status.text = "Ошибка при запуске: " + Log.getStackTraceString(e).take(1200)
                  }
                  val crash = prefs.getString("crash", null)
                  if (crash != null) {
                      status.text = "Прошлый вылет:\n" + crash
                      prefs.edit().remove("crash").apply()
                  }
                  status.setTextIsSelectable(true)
              }
          }
          KAI_EOF
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KaiIcons-apk
          path: app/build/outputs/apk/debug/app-debug.apk
